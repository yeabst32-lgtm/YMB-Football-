<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YMB FOOTBALL</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#071b12;color:white;
font-family:Arial;text-align:center;
}
header{
padding:15px;background:#063d25;
font-size:25px;font-weight:bold;
}
#menu{padding:25px}
button{
border:0;border-radius:12px;
padding:14px 22px;margin:6px;
background:#16bd58;color:white;
font-size:17px;font-weight:bold;
}
#game{display:none;padding:8px}
#score{
font-size:25px;font-weight:bold;
padding:12px;
}
canvas{
width:100%;max-width:900px;
background:#168c42;
border:4px solid white;
border-radius:8px;
touch-action:none;
}
.controls{
display:flex;justify-content:center;
align-items:center;gap:12px;
margin:12px auto;flex-wrap:wrap;
}
.controls button{
width:65px;height:58px;
font-size:23px;padding:5px;
}
#shoot{background:#e99a13}
</style>
</head>
<body>

<header>⚽ YMB FOOTBALL 🏆</header>

<div id="menu">
<h2>WELCOME TO YMB FC</h2>
<p>የእግር ኳስ ውድድር ጌም</p>
<button onclick="start()">PLAY MATCH</button>
<p>🇪🇹 ETHIOPIA VS WORLD 🌍</p>
</div>

<div id="game">
<div id="score">YMB FC 0 - 0 OPPONENT</div>
<canvas id="field" width="900" height="560"></canvas>

<div class="controls">
<button onclick="move(0,-1)">⬆️</button>
<button onclick="move(-1,0)">⬅️</button>
<button onclick="move(0,1)">⬇️</button>
<button onclick="move(1,0)">➡️</button>
<button id="shoot" onclick="kick()">SHOOT ⚽</button>
</div>
<button onclick="location.reload()">EXIT</button>
</div>

<script>
const c=document.getElementById("field");
const ctx=c.getContext("2d");

let player={x:180,y:280};
let ball={x:220,y:280,vx:0,vy:0};
let enemies=[];
let score=0,opponent=0;
let playing=false;
let dx=0,dy=0;

function start(){
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";

enemies=[];
for(let i=0;i<11;i++){
enemies.push({
x:550+(i%3)*65,
y:65+Math.floor(i/3)*105
});
}
playing=true;
loop();
}

function move(x,y){
dx=x;dy=y;
player.x+=x*18;
player.y+=y*18;
player.x=Math.max(25,Math.min(875,player.x));
player.y=Math.max(25,Math.min(535,player.y));
}

function kick(){
let d=Math.hypot(ball.x-player.x,ball.y-player.y);
if(d<75){
let a=Math.atan2(ball.y-player.y,ball.x-player.x);
ball.vx=Math.cos(a)*13+5;
ball.vy=Math.sin(a)*13;
}
}

function drawField(){
ctx.fillStyle="#168c42";
ctx.fillRect(0,0,900,560);

for(let i=0;i<9;i++){
if(i%2===0){
ctx.fillStyle="rgba(255,255,255,.06)";
ctx.fillRect(i*100,0,100,560);
}
}
ctx.strokeStyle="white";
ctx.lineWidth=4;
ctx.strokeRect(12,12,876,536);
ctx.beginPath();
ctx.moveTo(450,12);
ctx.lineTo(450,548);
ctx.stroke();
ctx.beginPath();
ctx.arc(450,280,75,0,Math.PI*2);
ctx.stroke();
ctx.strokeRect(12,165,110,230);
ctx.strokeRect(778,165,110,230);
ctx.fillStyle="white";
ctx.fillRect(0,220,13,120);
ctx.fillRect(887,220,13,120);
}

function drawPlayer(x,y,color,label){
ctx.fillStyle=color;
ctx.beginPath();
ctx.arc(x,y,17,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="white";
ctx.font="bold 13px Arial";
ctx.textAlign="center";
ctx.fillText(label,x,y+5);
}

function loop(){
if(!playing)return;

drawField();

enemies.forEach(e=>{
let a=Math.atan2(player.y-e.y,player.x-e.x);
e.x+=Math.cos(a)*0.55;
e.y+=Math.sin(a)*0.55;
drawPlayer(e.x,e.y,"#ed3434","O");
});

drawPlayer(player.x,player.y,"#087bff","Y");

ball.x+=ball.vx;
ball.y+=ball.vy;
ball.vx*=0.97;
ball.vy*=0.97;

if(ball.y<22||ball.y>538)ball.vy*=-0.8;

if(ball.x>890){
if(ball.y>220&&ball.y<340){
score++;
ball.x=220;ball.y=280;
}else ball.vx*=-1;
}
if(ball.x<10){
if(ball.y>220&&ball.y<340){
opponent++;
ball.x=220;ball.y=280;
}else ball.vx*=-1;
}

let d=Math.hypot(ball.x-player.x,ball.y-player.y);
if(d<35){
ball.vx+=(ball.x-player.x)*0.04;
ball.vy+=(ball.y-player.y)*0.04;
}

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(ball.x,ball.y,11,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle="black";
ctx.stroke();

document.getElementById("score").innerText=
"YMB FC "+score+" - "+opponent+" OPPONENT";

requestAnimationFrame(loop);
}

</script>
</body>
</html>

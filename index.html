!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>YMB Football 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06111b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;margin:4px}.screen{height:100vh;display:grid;place-items:center}.panel{width:min(760px,94vw);padding:28px;text-align:center;border-radius:25px;background:linear-gradient(145deg,#123d58,#091d2b);box-shadow:0 20px 70px #0009}h1{font-size:42px;margin:5px}.gold{color:#ffd53e}.play{font-size:23px;background:#ffd53e}.menuBtn{background:#f4f6f8}.hidden{display:none!important}
#game{display:none;height:100vh}.hud{height:55px;display:flex;justify-content:space-around;align-items:center;font-size:16px}.score{font-size:24px}.time{color:#ffd53e;font-size:24px}
#field{position:relative;width:min(96vw,960px);height:calc(100vh - 190px);min-height:360px;max-height:600px;margin:auto;border:4px solid white;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(90deg,#087a38 0 80px,#0a8b40 80px 160px);box-shadow:inset 0 0 80px #0006}
.mid{position:absolute;left:50%;top:0;width:3px;height:100%;background:#fff}.circle{position:absolute;left:calc(50% - 65px);top:calc(50% - 65px);width:130px;height:130px;border:3px solid white;border-radius:50%}.box{position:absolute;top:27%;height:46%;width:17%;border:3px solid white}.boxL{left:-3px}.boxR{right:-3px}.goal{position:absolute;top:40%;height:20%;width:25px;border:3px solid white}.goalL{left:-3px}.goalR{right:-3px}
.p,.ball{position:absolute;transform:translate(-50%,-50%);z-index:4}.p{width:32px;height:32px;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 8px #0009}.blue{background:#2088ff}.red{background:#e63e45}.keeper{background:#ffd43e}.sel{outline:4px solid white}.ball{width:15px;height:15px;background:white;border:2px solid #222;border-radius:50%;z-index:8}.name{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;text-shadow:0 2px 3px #000}
.controls{height:130px;display:flex;justify-content:center;align-items:center;gap:15px}.dpad{display:grid;grid-template-columns:55px 55px 55px}.dpad button{height:44px;margin:2px}.up{grid-column:2}.down{grid-column:2}.actions{max-width:330px}.shoot{background:#ffd43e}.pass{background:#70baff}.switch{background:#b7e76a}.pause{background:#ddd}.bar{display:inline-block;width:160px;height:8px;background:#ffffff30;border-radius:8px}.fill{display:block;height:100%;width:100%;background:#ffd43e;border-radius:8px}.toast{position:fixed;top:17%;left:50%;transform:translateX(-50%);background:#000d;padding:15px 22px;border-radius:15px;font-size:20px;z-index:20}
</style></head><body>
<div id="menu" class="screen"><div class="panel"><div>⚽ FOOTBALL 3D EXPERIENCE</div><h1>YMB <span class="gold">Football</span></h1><p>🏆 Career • 🤖 AI • ⚽ Skills • 🏟️ Stadium</p><button class="play" onclick="start()">▶ PLAY MATCH</button><br><button class="menuBtn" onclick="career()">🏆 CAREER</button><button class="menuBtn" onclick="showInfo()">ℹ️ INFO</button></div></div>
<div id="game"><div class="hud"><b>🔵 YMB FC</b><span class="score" id="score">0 - 0</span><span class="time" id="time">90</span><b>🔴 ETHIO STARS</b></div><div style="text-align:center;font-size:12px">⚡ <span class="bar"><span id="stam" class="fill"></span></span></div>
<div id="field"><div class="mid"></div><div class="circle"></div><div class="box boxL"></div><div class="box boxR"></div><div class="goal goalL"></div><div class="goal goalR"></div>
<div id="p0" class="p blue sel" style="left:23%;top:50%"><span class="name">YEAB ★</span></div><div id="p1" class="p blue" style="left:36%;top:34%"></div><div id="p2" class="p blue" style="left:36%;top:66%"></div><div id="p3" class="p blue" style="left:48%;top:50%"></div><div id="p4" class="p blue" style="left:10%;top:50%"></div>
<div id="r1" class="p red" style="left:68%;top:38%"></div><div id="r2" class="p red" style="left:68%;top:62%"></div><div id="r3" class="p red" style="left:80%;top:50%"></div><div id="rk" class="p keeper" style="left:94%;top:50%"><span class="name">GK</span></div><div id="ball" class="ball" style="left:29%;top:50%"></div></div>
<div style="text-align:center">⭐ Skill: <b id="skill">100</b></div><div class="controls"><div class="dpad"><button class="up" onclick="move(0,-1)">⬆</button><button onclick="move(-1,0)">⬅</button><button class="down" onclick="move(0,1)">⬇</button><button onclick="move(1,0)">➡</button></div><div class="actions"><button class="shoot" onclick="kick('shoot')">⚽ SHOOT</button><button class="pass" onclick="kick('pass')">↗ PASS</button><button class="switch" onclick="switchP()">🔄 SWITCH</button><br><button class="pause" onclick="pause()">⏸ PAUSE</button><button onclick="exitGame()">🚪 EXIT</button></div></div></div><div id="toast" class="toast hidden"></div>
<script>
let X=[23,36,36,48,10],Y=[50,34,66,50,50],RX=[68,68,80,94],RY=[38,62,50,50],bx=29,by=50,sel=0,us=0,them=0,t=90,st=100,paused=false,timer;
const $=x=>document.getElementById(x);const d=(a,b,c,e)=>Math.hypot(a-c,b-e);
function draw(){for(let i=0;i<5;i++){let e=$('p'+i);e.style.left=X[i]+'%';e.style.top=Y[i]+'%';e.classList.toggle('sel',i===sel)}for(let i=1;i<=3;i++){$('r'+i).style.left=RX[i-1]+'%';$('r'+i).style.top=RY[i-1]+'%'}$('rk').style.left=RX[3]+'%';$('rk').style.top=RY[3]+'%';$('ball').style.left=bx+'%';$('ball').style.top=by+'%';$('score').textContent=us+' - '+them;$('time').textContent=t;$('stam').style.width=st+'%';$('skill').textContent=Math.round(st)}
function start(){menu.style.display='none';game.style.display='block';reset();timer=setInterval(tick,1000);toast('YMB FC መጫወት ጀመረ! 🔥')}
function reset(){X=[23,36,36,48,10];Y=[50,34,66,50,50];RX=[68,68,80,94];RY=[38,62,50,50];bx=29;by=50;sel=0;us=them=0;t=90;st=100;paused=false;draw()}
function move(dx,dy){if(paused)return;let s=3.4;X[sel]=Math.max(4,Math.min(96,X[sel]+dx*s));Y[sel]=Math.max(5,Math.min(95,Y[sel]+dy*s));st=Math.max(5,st-1);if(d(X[sel],Y[sel],bx,by)<10){bx=X[sel]+dx*5;by=Y[sel]+dy*5}draw()}
function kick(type){if(paused)return;if(d(X[sel],Y[sel],bx,by)>15){toast('ኳሱን ቅረብ!');return}if(type==='pass'){bx=Math.min(80,X[sel]+13);by=Y[sel];toast('PASS! 🎯');return}clearInterval(timer);let sx=bx,sy=by,a=0;let an=setInterval(()=>{if(paused)return;a+=.07;bx=sx+(97-sx)*a;by=sy+(50-sy)*a;draw();if(a>=1){clearInterval(an);if(Math.abs(by-50)<12){us++;toast('GOOOOOAL! 🔥🥳')}else toast('Miss!');bx=29;by=50;X[0]=23;Y[0]=50;draw();timer=setInterval(tick,1000)}},30)}
function tick(){if(paused)return;t--;st=Math.min(100,st+1);for(let i=0;i<3;i++){let dx=bx-RX[i],dy=by-RY[i],z=Math.hypot(dx,dy);if(z>2){RX[i]+=dx/z*.7;RY[i]+=dy/z*.7}}let g=Math.random()<.10;if(g){them++;toast('ETHIO STARS ጎል! 😮')}if(t<=0){clearInterval(timer);toast(us>them?'🏆 አሸንፈሃል!':'ጨዋታው ተጠናቋል');}draw()}
function switchP(){sel=(sel+1)%5;toast('Player '+(sel+1));draw()}function pause(){paused=!paused;toast(paused?'⏸ PAUSED':'▶ RESUME')}function exitGame(){clearInterval(timer);game.style.display='none';menu.style.display='grid'}function toast(s){let e=$('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window.z);window.z=setTimeout(()=>e.classList.add('hidden'),1300)}function career(){toast('🏆 Career Mode: ቀጣይ ደረጃ')}function showInfo(){toast('YMB Football • V3')}document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')move(0,-1);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.code==='Space')kick('shoot');if(e.key==='p')pause()});draw();
</script></body></html>
